<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>History</title>
    <style>
      body { font-family: "Segoe UI", system-ui, sans-serif; margin: 0; background: #f4f4f7; color: #1b1b1f; }
      header { padding: 16px 20px; }
      h1 { font-size: 18px; margin: 0; }
      main { padding: 0 20px 20px; }
      .empty { color: #555; }
      .session { background: #fff; border: 1px solid #d8d8e0; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
      .session h2 { font-size: 13px; margin: 0 0 8px; color: #444; }
      .entry { border-top: 1px solid #eee; padding: 8px 0; }
      .entry time { font-size: 12px; color: #666; }
      .q { font-weight: 600; margin: 4px 0; }
      .a { white-space: pre-wrap; font-size: 13px; }
    </style>
  </head>
  <body>
    <header><h1>History</h1></header>
    <main id="root"><p class="empty">No session history.</p></main>
    <script src="history.js"></script>
  </body>
</html>
